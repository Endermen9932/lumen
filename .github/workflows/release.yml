name: Build & Release

on:
  push:
    branches: [ main, "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

# One queue for all branches: every push is merged into main in order, none is skipped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every change is merged into main automatically, and the release is always built from
      # main – so each release contains all changes ever made.
      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads origin main > /dev/null; then
            git fetch origin main
            git checkout -B main origin/main
            if [ "$BRANCH" != "main" ]; then
              git merge --no-edit "origin/$BRANCH"
            fi
          else
            git checkout -B main
          fi
          git push origin main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -PbuildNumber=${{ github.run_number }}

      - name: Build APKs (signed with the Android debug key)
        run: ./gradlew --no-daemon assembleRelease assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Rename APKs
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Lumen-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "Lumen-v${VERSION}-debug.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=Lumen-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "debugfile=Lumen-v${VERSION}-debug.apk" >> "$GITHUB_OUTPUT"
          sha256sum Lumen-v*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Lumen-v${{ steps.apk.outputs.version }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.debugfile }}

      # Desktop app for Ubuntu 24.04 ("Lumen Indexer"): tests, .deb build and an install smoke test.
      # A failure here must not block the APK release – the run is marked failed at the end instead.
      - name: Desktop app (.deb)
        id: deb
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="1.0.${{ github.run_number }}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/pip" install -q -r desktop/requirements.txt pytest
          (cd desktop && "$RUNNER_TEMP/test-venv/bin/python" -m pytest -q tests)

          desktop/packaging/build_deb.sh "$VERSION" dist
          sudo apt-get install -y -qq "./dist/lumen-indexer_${VERSION}_amd64.deb"

          # Smoke test of the installed package: version, window, and a real indexing run with the
          # smallest model (downloaded from Hugging Face) including export.
          lumen-indexer --version | grep -q "$VERSION"
          xvfb-run -a /opt/lumen-indexer/venv/bin/python -I -c "
          import sys
          from gi.repository import GLib
          from lumen_indexer import gui
          app = gui.App()
          app.connect('activate', lambda a: GLib.timeout_add(1500, a.quit))
          sys.exit(app.run(None))"
          export LUMEN_INDEXER_HOME="$RUNNER_TEMP/lumen-home"
          mkdir -p "$RUNNER_TEMP/photos/Camera"
          /opt/lumen-indexer/venv/bin/python -I -c "
          from PIL import Image
          for i in range(4):
              Image.new('RGB', (800, 600), (40 * i, 90, 160)).save(f'$RUNNER_TEMP/photos/Camera/PXL_2024031{i}_120000.jpg')"
          lumen-indexer index "$RUNNER_TEMP/photos" -m mobileclip-s0 -o "$RUNNER_TEMP/index.lumenindex"
          lumen-indexer inspect "$RUNNER_TEMP/index.lumenindex" | grep -q "4 Einträge"
          # Face detection with the smallest model and the large detector ("Hoch"), plus export.
          lumen-indexer faces "$RUNNER_TEMP/photos" -m face-buffalo-s --hq -o "$RUNNER_TEMP/faces.lumenindex"
          lumen-indexer inspect "$RUNNER_TEMP/faces.lumenindex" | grep -q "4 Einträge"
          lumen-indexer gpu status

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Lumen ${{ steps.apk.outputs.version }}
          target_commitish: ${{ env.RELEASE_SHA }}
          make_latest: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.debugfile }}
            dist/lumen-indexer_*.deb
          body: |
            **Lumen Photos ${{ steps.apk.outputs.version }}** – Offline-Galerie für das Pixel 10 Pro, ohne Google-Dienste.

            - Material 3 Expressive Design mit dynamischen Farben und Shared-Element-Animationen
            - Speicher optimieren: ganze Galerie auf Full HD skalieren, Qualitätsstufen mit Vorher/Nachher-Vorschau, Ultra HDR & EXIF bleiben erhalten
            - KI-Suche komplett offline (MobileCLIP / SigLIP 2, 6 Stufen von „Blitz“ bis „Maximum“)
            - Duplikate & ähnliche Serien, Erinnerungen, Editor, Video-Player, Papierkorb
            - Suche mit festen, kombinierbaren Filtern (Datum, Typ, Ort, Personen, Album, Favoriten) – Vorschläge aus dem Suchtext per Regeln und optional per Sprachmodell (Qwen 2.5, offline)
            - KI-Indexierung und Gesichtserkennung am PC – mit der Ubuntu-App „Lumen Indexer“ (auch auf NVIDIA-GPUs) berechnen und in der App importieren (KI-Modelle → Indexierung vom PC)

            **Dateien** (beide mit dem Android-Debug-Key signiert, lassen sich übereinander installieren):
            - `Lumen-v${{ steps.apk.outputs.version }}.apk` – optimierter Build (R8), empfohlen
            - `Lumen-v${{ steps.apk.outputs.version }}-debug.apk` – Debug-Build (debuggable, langsamer)

            Installation: APK auf dem Pixel öffnen und „Unbekannte Apps installieren“ erlauben.

            **Lumen Indexer für Ubuntu 24.04** – `lumen-indexer_${{ steps.apk.outputs.version }}_amd64.deb`:
            `sudo apt install ./lumen-indexer_${{ steps.apk.outputs.version }}_amd64.deb`
            Fotos vom Handy auf den PC kopieren, Ordner wählen, indexieren (KI-Suche und/oder Gesichter), `.lumenindex`-Dateien exportieren und in Lumen importieren.
            NVIDIA-GPU: im Programm unter „Leistung“ die CUDA-Laufzeit installieren (ca. 2,5 GB, nur NVIDIA-Treiber nötig).

            Build aus `main` @ ${{ env.RELEASE_SHA }} – enthält alle bisherigen Änderungen.

      - name: Fail the run if the .deb is missing
        if: steps.deb.outcome != 'success'
        run: |
          echo "::error::The desktop .deb could not be built or failed its smoke test (the APK release was published without it)."
          exit 1
